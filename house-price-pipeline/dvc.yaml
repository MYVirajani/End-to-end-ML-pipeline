stages:
  validate:
    cmd: python src/validate.py
    deps: [src/validate.py, data/raw/house.csv]
  prepare:
    cmd: python src/prepare.py
    deps: [src/prepare.py, data/raw/house.csv, src/validate.py]
    params: [data]
    outs: [data/processed]
  train:
    cmd: python src/train.py
    deps: [src/train.py, data/processed]
    params: [train]
    outs: [models/model.pkl]
    metrics: [metrics.json]